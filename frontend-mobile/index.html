<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6d52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="灵山导览" />
    <meta name="description" content="灵山胜境游客手机与景区终端专用 AI 导览。" />
    <link rel="manifest" href="/mobile/manifest.webmanifest" />
    <link rel="stylesheet" href="/mobile/styles.css" />
    <title>灵山胜境移动导览</title>
  </head>
  <body>
    <main class="mobile-shell">
      <header class="mobile-topbar">
        <button class="brand-button" type="button" data-view="guide">
          <span class="brand-mark">灵</span>
          <span>
            <strong>灵山胜境</strong>
            <small id="personaName">AI 导览</small>
          </span>
        </button>
        <button id="serviceStatus" class="service-pill offline" type="button">本地资料</button>
      </header>

      <section id="guideView" class="mobile-view active" aria-label="景点导览">
        <div class="hero-spot">
          <img id="spotPhoto" src="/assets/scenic/photos/lingshan-grand-buddha.jpg" alt="当前景点" />
          <div>
            <p id="spotZone">推荐景点</p>
            <h1 id="spotName">灵山大佛</h1>
            <span id="spotMeta">建议游览 60 分钟</span>
          </div>
        </div>

        <div class="spot-copy">
          <p id="spotDescription">正在加载景区资料。</p>
          <div id="spotTags" class="tag-row"></div>
        </div>

        <div class="action-grid">
          <button id="speakSpotButton" class="primary-action" type="button">播放讲解</button>
          <button id="locateButton" class="secondary-action" type="button">附近景点</button>
        </div>

        <div id="spotList" class="spot-list" aria-label="景点列表"></div>
      </section>

      <section id="chatView" class="mobile-view" aria-label="AI 问答">
        <div id="chatMessages" class="chat-thread"></div>
        <div id="suggestions" class="quick-row"></div>
      </section>

      <section id="photoView" class="mobile-view" aria-label="拍照讲解">
        <label class="photo-picker">
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
          <img id="photoPreview" alt="上传照片预览" hidden />
          <span id="photoPlaceholder">选择或拍摄景区照片</span>
        </label>
        <textarea id="photoQuestion" rows="3" placeholder="可补充问题，例如这是什么景点、附近怎么逛"></textarea>
        <button id="analyzePhotoButton" class="primary-action" type="button">图片讲解</button>
        <article id="photoAnswer" class="answer-card" hidden></article>
      </section>

      <section id="routeView" class="mobile-view" aria-label="路线推荐">
        <div class="route-form">
          <label>
            游览时长
            <select id="durationSelect"></select>
          </label>
          <label>
            兴趣偏好
            <select id="preferenceSelect"></select>
          </label>
          <button id="routeButton" class="primary-action" type="button">生成路线</button>
        </div>
        <article id="routeResult" class="route-result"></article>
      </section>

      <form id="chatForm" class="mobile-chatbar">
        <button id="voiceButton" class="voice-button" type="button">语音</button>
        <input id="questionInput" type="text" maxlength="500" placeholder="问景点、路线或服务" autocomplete="off" />
        <button class="send-button" type="submit">发送</button>
      </form>

      <nav class="bottom-tabs" aria-label="移动端功能">
        <button class="active" type="button" data-view="guide">导览</button>
        <button type="button" data-view="chat">问答</button>
        <button type="button" data-view="photo">拍照</button>
        <button type="button" data-view="route">路线</button>
      </nav>
    </main>

    <script src="/mobile/app.js" type="module"></script>
  </body>
</html>
