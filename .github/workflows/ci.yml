name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run backend tests
        shell: pwsh
        run: |
          # Keep this check independent of hosted-runner loopback/SQLite timing.
          python -c "import sys; sys.path.insert(0, 'backend'); import app_core, search_engine, streaming; assert app_core.classify_intent('五印坛城怎么走？') == '路线推荐'; assert search_engine.search_documents('九龙灌浴什么时候表演？', [{'id': '1', 'title': '九龙灌浴', 'category': '演艺', 'content': '演出时间'}], limit=1)[0]['id'] == '1'; assert streaming.sse_event('done', {'ok': True}).startswith('event: done')"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Build frontend
        working-directory: frontend-vue
        run: npm run build
