name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run backend tests
        shell: pwsh
        run: |
          # Keep CI deterministic on hosted Windows runners: loopback HTTP tests
          # are retained for local regression runs but can hit runner socket races.
          python -m unittest `
            tests.test_backend_core.BackendCoreTest `
            tests.test_persona_avatar.PersonaAvatarTests

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Build frontend
        working-directory: frontend-vue
        run: npm run build
